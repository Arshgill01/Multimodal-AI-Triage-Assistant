[package]
name = "triage-backend"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust inference backend for the Multimodal AI Triage Assistant"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# LightGBM FFI bindings — loads triage_multimodal_model.txt natively
lightgbm3 = "1.0"

# HTTP client — calls Python preprocessing microservice
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Audit trail — SQLite for decision logging
rusqlite = { version = "0.39", features = ["bundled"] }

# Timestamps + UUIDs for audit entries
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

